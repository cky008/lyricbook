name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality-build:
    name: Quality gate and Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Pin npm 12.0.2
        run: npm install --global npm@12.0.2
      - name: Require committed lockfiles
        run: test -f package-lock.json && test -f Cargo.lock
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Web tests before build
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run validate:content
          npm run validate:repo
      - name: Rust tests before build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
      - name: Install wasm-pack 0.15.0
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build WASM adapter
        run: npm run build:wasm
      - name: Build production site
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: quality-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
