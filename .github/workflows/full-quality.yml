name: Full quality

on:
  push:
    branches: [develop, "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser, mobile, accessibility, and print
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
      - name: Pin npm 12.0.2
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "package-lock.json is absent on this bootstrap commit; generating it with npm install."
            npm install --no-audit --no-fund
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Formatting, lint, unit, and build gate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run validate:content
          npm run validate:repo
          npm run build
      - name: Cross-browser end-to-end tests
        run: npm run test:e2e
      - name: Offline production smoke test
        run: npm run check:offline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
