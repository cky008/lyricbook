name: CI

on:
  push:
    branches: [develop, "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
      - name: Pin npm 12.0.2
        run: npm install --global npm@12.0.2
      - name: Require committed JavaScript lockfile
        run: test -f package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Validate public content
        run: npm run validate:content
      - name: Validate repository completeness
        run: npm run validate:repo
      - name: Production build
        run: npm run build

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Require committed Rust lockfile
        run: test -f Cargo.lock
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Install wasm-pack 0.15.0
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build WASM adapter
        run: wasm-pack build crates/lyricbook-wasm --target web --out-dir ../../packages/wasm/pkg --release -- --locked
