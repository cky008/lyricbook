name: Release artifacts
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: zip -r "lyricbook-${GITHUB_REF_NAME}-dist.zip" dist
      - uses: softprops/action-gh-release@v2
        with:
          files: lyricbook-*-dist.zip
