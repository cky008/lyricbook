name: Bug report
description: Report a reproducible LyricBook problem
title: "[Bug]: "
body:
  - type: textarea
    attributes: { label: What happened? }
    validations: { required: true }
  - type: textarea
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: input
    attributes: { label: Browser and operating system }
  - type: checkboxes
    attributes:
      label: Privacy
      options:
        - label: I removed copyrighted lyrics, private exports, and personal information.
          required: true
